<h1>高雄展覽館</h1>

<div class="content">
    <img src="images/exhibition.jpg">
    <div class="text">
        <p>
        高雄展覽館位於亞洲新灣區核心地帶，
        於2014年啟用，是南台灣最大的國際級會展場館，
        也是台灣首座取得黃金級綠建築標章的展覽館。
        </p>

        <p>
        建築由台灣建築師姚仁喜設計，
        外觀採用波浪形屋頂與流線造型，
        呼應高雄海港城市的意象。
        館內設有南北兩個展廳，共可容納1,500個標準攤位。
        </p>

        <p>
        展覽館鄰近高雄港、輕軌及捷運站，交通便利，
        周邊還有高雄市立圖書館總館、港埠旅運中心等新建設，
        共同形成亞洲新灣區的嶄新城市風貌，
        每年舉辦數十場國際展覽與會議，推動高雄的經濟與觀光發展。
        </p>
