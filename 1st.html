<h1>高雄85大樓</h1>

<div class="content">
    <img src="images/85tower.jpg">
    <div class="text">
        <p>
        高雄85大樓位於苓雅區，樓高347.5公尺，共85層樓，
        於1997年完工，曾經是台灣最高的摩天大樓，
        也是當時全球排名前十大高樓之一。
        </p>

        <p>
        大樓由建築師李祖原設計，外觀採用獨特的「高」字造型，
        象徵高雄的城市精神。建築分為兩棟塔樓，
        分別作為商辦、觀光旅館及住宅使用。
        </p>

        <p>
        74樓設有觀景台，可360度俯瞰高雄市景與海港風光，
        是遊客到高雄必訪的景點之一。大樓夜間有燈光照明，
        成為高雄夜空中最耀眼的城市地標。
        </p>
