<h1>高雄流行音樂中心</h1>

<div class="content">
    <img src="images/musiccenter.jpg">
    <div class="text">
        <p>
        高雄流行音樂中心位於愛河灣與高雄港的交界處，
        於2021年正式啟用，是南台灣最重要的音樂展演場館，
        也是台灣流行音樂產業的重要據點。
        </p>

        <p>
        建築群由西班牙建築師Manuel Alvarez Monteserín設計，
        以海洋意象為靈感，包含六角形珊瑚礁造型的室內表演廳、
        海豚造型的戶外表演場地，以及全台最大的專業音樂錄音室。
        </p>

        <p>
        園區內設有流行音樂展示館、海洋文化展覽空間，
        並定期舉辦各類音樂節、演唱會與藝文活動，
        入夜後建築燈光倒映在愛河灣上，成為港都最美的夜景之一。
        </p>
