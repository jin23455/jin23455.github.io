<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>高雄市建築地標介紹</title>

<style>
.top-id{
    position:absolute;top:10px;right:10px;
    font-size:14px;color:#666;
}
body{
    font-family:Microsoft JhengHei;
    background:#eef6ff;
    text-align:center;
}

.card{
    width:750px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    text-align:left;
}

.card-content{
    display:flex;
    align-items:center;
    gap:20px;
}

.card-text{
    flex:1;
}

.card-text h2{
    margin-top:0;
}

img{
    width:300px;
    border-radius:10px;
    flex-shrink:0;
}

.btn{
    display:inline-block;
    margin-top:10px;
    background:#0066cc;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
}

.btn:hover{
    background:#004a99;
}
</style>
</head>

<body>

<div class="top-id">91422131 建築一甲</div>

<h1>高雄市建築地標介紹</h1>

<div class="card">
    <div class="card-content">
        <img src="images/85tower.jpg">
        <div class="card-text">
            <h2>高雄85大樓</h2>
            <p>
                位於高雄市苓雅區，曾是台灣最高摩天大樓，
                是高雄最具代表性的城市地標之一。
            </p>
            <a class="btn" href="1st.html">高雄85大樓</a>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-content">
        <img src="images/musiccenter.jpg">
        <div class="card-text">
            <h2>高雄流行音樂中心</h2>
            <p>
                位於愛河灣旁，是南台灣重要的音樂展演場館，
                外觀充滿海洋意象。
            </p>
            <a class="btn" href="2nd.html">高雄流行音樂中心</a>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-content">
        <img src="images/weiwuying.jpg">
        <div class="card-text">
            <h2>衛武營國家藝術文化中心</h2>
            <p>
                亞洲最大的單一屋頂劇院，
                是高雄重要的藝文表演中心。
            </p>
            <a class="btn" href="3rd.html">衛武營國家藝術文化中心</a>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-content">
        <img src="images/exhibition.jpg">
        <div class="card-text">
            <h2>高雄展覽館</h2>
            <p>
                位於亞洲新灣區，
                是高雄重要的國際會展地標。
            </p>
            <a class="btn" href="4th.html">高雄展覽館</a>
        </div>
    </div>
</div>

<h2>學習心得</h2>

<p>
透過製作本網站，我學習到HTML網頁設計、
圖片插入、超連結設定與CSS版面設計，
也更加認識高雄市重要建築地標的特色與歷史。
</p>

</body>
</html>
